<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- Empty fragment used as placeholder for unused chart/navigation slots -->
<th:block th:fragment="empty"></th:block>

<!-- Users picker in the report-actions bar (same slot as week/month nav) -->
<div th:fragment="chart-navigation" class="report-actions">
  <form th:replace="~{reports/_user-select::form(~{::breakdown-preset-params})}">
    <th:block th:fragment="breakdown-preset-params">
      <input type="hidden" name="preset" th:value="${preset}"/>
      <th:block th:if="${preset == 'custom'}">
        <input type="hidden" name="from" th:value="${#temporals.format(from, 'yyyy-MM-dd')}"/>
        <input type="hidden" name="to" th:value="${#temporals.format(to, 'yyyy-MM-dd')}"/>
      </th:block>
    </th:block>
  </form>
</div>

<!-- Main breakdown content, injected into user-report.html via overrideContentFragment -->
<th:block th:fragment="content">

  <div class="flex justify-end mb-4">
    <a th:href="${printUrl}" target="_blank"
       class="flex items-center gap-1.5 text-sm text-gray-500 dark:text-zinc-400 hover:text-gray-800 dark:hover:text-zinc-200 border border-gray-300 dark:border-zinc-600 rounded px-3 py-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.75 19.2m10.56-5.371L17.25 19.2m0 0a2.25 2.25 0 0 1-2.25 2.25H9a2.25 2.25 0 0 1-2.25-2.25m10.5 0v-7.5a2.25 2.25 0 0 0-2.25-2.25H9A2.25 2.25 0 0 0 6.75 11.7v7.5" />
      </svg>
      Print / export
    </a>
  </div>

  <!-- Date range selector — hidden inputs carry the current user selection through period changes -->
  <form th:action="@{/report/breakdown}" method="get" class="mb-8">
    <th:block th:if="${allUsersSelected}">
      <input type="hidden" name="everyone" value=""/>
    </th:block>
    <th:block th:if="${not allUsersSelected}">
      <th:block th:each="uid : ${selectedUserIds}">
        <input type="hidden" name="user" th:value="${uid}"/>
      </th:block>
    </th:block>

    <div class="flex flex-wrap items-end gap-4">
      <div class="flex flex-wrap gap-x-4 gap-y-2">
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="preset" value="week"
                 th:checked="${preset == 'week'}" onchange="this.form.submit()"/>
          <span th:text="#{report.breakdown.preset.week}">This week</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="preset" value="last-week"
                 th:checked="${preset == 'last-week'}" onchange="this.form.submit()"/>
          <span th:text="#{report.breakdown.preset.last-week}">Last week</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="preset" value="month"
                 th:checked="${preset == 'month'}" onchange="this.form.submit()"/>
          <span th:text="#{report.breakdown.preset.month}">This month</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="preset" value="last-month"
                 th:checked="${preset == 'last-month'}" onchange="this.form.submit()"/>
          <span th:text="#{report.breakdown.preset.last-month}">Last month</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="preset" value="last-30"
                 th:checked="${preset == 'last-30'}" onchange="this.form.submit()"/>
          <span th:text="#{report.breakdown.preset.last-30}">Last 30 days</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="preset" value="custom"
                 th:checked="${preset == 'custom'}" id="preset-custom"/>
          <span th:text="#{report.breakdown.preset.custom}">Custom</span>
        </label>
      </div>

      <div class="flex items-end gap-2" th:classappend="${preset != 'custom'} ? 'opacity-40' : ''">
        <div class="flex flex-col gap-1">
          <label for="from" class="text-xs text-gray-500 dark:text-zinc-400" th:text="#{report.breakdown.from}">From</label>
          <input type="date" id="from" name="from"
                 th:value="${#temporals.format(from, 'yyyy-MM-dd')}"
                 class="border border-gray-300 dark:border-zinc-600 rounded px-2 py-1 text-sm dark:bg-zinc-800"
                 onchange="document.getElementById('preset-custom').checked=true"/>
        </div>
        <div class="flex flex-col gap-1">
          <label for="to" class="text-xs text-gray-500 dark:text-zinc-400" th:text="#{report.breakdown.to}">To</label>
          <input type="date" id="to" name="to"
                 th:value="${#temporals.format(to, 'yyyy-MM-dd')}"
                 class="border border-gray-300 dark:border-zinc-600 rounded px-2 py-1 text-sm dark:bg-zinc-800"
                 onchange="document.getElementById('preset-custom').checked=true"/>
        </div>
        <button type="submit" class="button-secondary text-sm" th:text="#{report.breakdown.apply}">Apply</button>
      </div>
    </div>
  </form>

  <!-- Empty state -->
  <p th:if="${!breakdown.hasData()}"
     class="text-gray-500 dark:text-zinc-400 italic"
     th:text="#{report.breakdown.empty}">No time entries for this period.</p>

  <th:block th:if="${breakdown.hasData()}">

    <p class="text-sm text-gray-500 dark:text-zinc-400 mb-6">
      <span th:text="#{report.breakdown.total}">Total:</span>
      <span class="font-semibold tabular-nums" th:text="${breakdown.totalHours()}"></span>
    </p>

    <div class="grid grid-cols-1 gap-10 lg:grid-cols-2">

      <!-- By Customer / Project -->
      <section>
        <h2 class="text-base font-semibold mb-4" th:text="#{report.breakdown.by-project}">By Customer &amp; Project</h2>
        <div class="flex flex-col gap-3">
          <div th:each="customer : ${breakdown.byCustomer()}"
               class="rounded-lg border border-gray-200 dark:border-zinc-700 overflow-hidden">
            <!-- Customer header -->
            <div class="flex items-center justify-between px-4 py-2 bg-gray-50 dark:bg-zinc-800">
              <span class="font-medium text-sm" th:text="${customer.customerName()}"></span>
              <span class="tabular-nums text-sm font-semibold" th:text="${customer.hours()}"></span>
            </div>
            <!-- Percentage bar -->
            <div class="h-1 bg-gray-100 dark:bg-zinc-700">
              <div class="h-1 bg-blue-500 dark:bg-sky-500"
                   th:style="|width: ${customer.percent()}%|"></div>
            </div>
            <!-- Projects -->
            <details th:each="project : ${customer.projects()}"
                     class="border-t border-gray-100 dark:border-zinc-800 group">
              <summary class="flex items-center justify-between px-4 py-2 cursor-pointer list-none hover:bg-gray-50 dark:hover:bg-zinc-800/50">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                  <div class="w-20 h-1.5 rounded-full bg-gray-100 dark:bg-zinc-700 shrink-0">
                    <div class="h-1.5 rounded-full bg-blue-300 dark:bg-sky-700"
                         th:style="|width: ${project.percent()}%|"></div>
                  </div>
                  <span class="text-sm text-gray-700 dark:text-zinc-300 truncate" th:text="${project.projectName()}"></span>
                  <span th:if="${#lists.size(project.byUser()) > 1}"
                        class="text-xs text-gray-400 dark:text-zinc-500 shrink-0 group-open:hidden"
                        th:text="|${#lists.size(project.byUser())} people|"></span>
                </div>
                <span class="tabular-nums text-sm text-gray-500 dark:text-zinc-400 ml-4 shrink-0" th:text="${project.hours()}"></span>
              </summary>
              <!-- Per-user rows — each expandable to daily breakdown -->
              <details th:each="contrib : ${project.byUser()}"
                       class="border-t border-gray-100 dark:border-zinc-800/60 group/user">
                <summary class="flex items-center justify-between px-4 py-1.5 bg-gray-50 dark:bg-zinc-800/40 cursor-pointer list-none hover:bg-gray-100 dark:hover:bg-zinc-700/40">
                  <span class="text-xs text-gray-500 dark:text-zinc-400 pl-24 truncate" th:text="${contrib.userName()}"></span>
                  <div class="flex items-center gap-2 ml-4 shrink-0">
                    <span th:if="${#lists.size(contrib.byDay()) > 1}"
                          class="text-xs text-gray-400 dark:text-zinc-600 group-open/user:hidden"
                          th:text="|${#lists.size(contrib.byDay())}d|"></span>
                    <span class="tabular-nums text-xs text-gray-400 dark:text-zinc-500" th:text="${contrib.hours()}"></span>
                  </div>
                </summary>
                <!-- Per-day rows -->
                <div th:each="day : ${contrib.byDay()}"
                     class="flex items-center justify-between px-4 py-1 bg-white dark:bg-zinc-900/60 border-t border-gray-100 dark:border-zinc-800/40">
                  <span class="text-xs text-gray-400 dark:text-zinc-600 pl-32" th:text="${day.date()}"></span>
                  <span class="tabular-nums text-xs text-gray-400 dark:text-zinc-500 ml-4 shrink-0" th:text="${day.hours()}"></span>
                </div>
              </details>
            </details>
          </div>
        </div>
      </section>

      <!-- By Activity Type -->
      <section>
        <h2 class="text-base font-semibold mb-4" th:text="#{report.breakdown.by-activity}">By Activity Type</h2>
        <div class="flex flex-col gap-2">
          <div th:each="activity : ${breakdown.byActivityType()}"
               class="rounded-lg border border-gray-200 dark:border-zinc-700 overflow-hidden">
            <div class="flex items-center justify-between px-4 py-2 bg-gray-50 dark:bg-zinc-800">
              <span class="font-medium text-sm" th:text="${activity.name()}"></span>
              <span class="tabular-nums text-sm font-semibold" th:text="${activity.hours()}"></span>
            </div>
            <div class="h-1 bg-gray-100 dark:bg-zinc-700">
              <div class="h-1 bg-emerald-500 dark:bg-emerald-600"
                   th:style="|width: ${activity.percent()}%|"></div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </th:block>
</th:block>

</body>
</html>
